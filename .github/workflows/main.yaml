name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  ci-basic:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    container: fedorapython/fedora-python-tox:latest
    steps:
      - uses: actions/checkout@v6

      - name: Install base Python dependencies
        run: |
          python3 -m pip install --upgrade tox

      - name: Execute tox
        run: |
          tox -e format,lint,poetry

  ci-unittests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - toxenv: py38
            fedver: f41
          - toxenv: py39
            fedver: latest
          - toxenv: py310
            fedver: latest
          - toxenv: py311
            fedver: latest
          - toxenv: py312
            fedver: latest
          - toxenv: py313
            fedver: latest
          - toxenv: py314
            fedver: latest
    runs-on: ubuntu-latest
    container: "fedorapython/fedora-python-tox:${{ matrix.fedver }}"
    steps:
      - uses: actions/checkout@v6

      - name: Install RPM dependencies
        run: |
          dnf install -y libpq-devel postgresql-server libffi-devel

      - name: Set up testrunner user
        run: |
          useradd testrunner
          chown -R testrunner: .

      - name: Execute tox
        run: |
          su testrunner -c 'tox -e ${{ matrix.toxenv }}'

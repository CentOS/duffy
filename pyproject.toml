[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "duffy"
version = "3.4.0"
description = "CentOS CI provisioner"
authors = ["Nils Philippsen <nils@redhat.com>", "Vipul Siddharth <siddharthvipul1@gmail.com>", "Akashdeep Dhar <akashdeep@redhat.com>", "Ben Capper <bcapper@redhat.com>"]
license = "MIT"
maintainers = ["Nils Philippsen <nils@redhat.com>", "Vipul Siddharth <siddharthvipul1@gmail.com>", "Akashdeep Dhar <akashdeep@redhat.com>", "Ben Capper <bcapper@redhat.com>"]
readme = "README.md"
homepage = "https://github.com/CentOS/duffy"
repository = "https://github.com/CentOS/duffy"
documentation = "https://github.com/CentOS/duffy/wiki"
keywords = ["baremetal", "ci", "vm", "opennebula", "centos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Ansible",
    "Framework :: AsyncIO",
    "Framework :: Celery",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Operating System",
]

[tool.poetry.dependencies]
python = "<4.0,>=3.8"
click = "<9.0.0,>=8.0.3"
PyYAML = "<7.0.0,>=6.0.0"
SQLAlchemy = {version = "<3,>=2.0.5", extras=["asyncio"], optional = true}
alembic = {version = "^1.7.5", optional = true}
bcrypt = {version = "<6.0.0,>=3.2", optional = true}
fastapi = {version = "<0.163.0,>=0.93", optional = true}
uvicorn = {version = "<0.55.0,>=0.15", optional = true}
Jinja2 = {version = "<4,>=3.0.3", optional = true}
ansible-runner = [
    { version = "<2.4,>=2.1.1", python = "~3.8", optional = true },
    { version = "<3,>=2.4", python = ">=3.9,<4", optional = true },
]
asyncpg = {version = "<0.33.0,>=0.25", optional = true}
celery = {version = "<6,>=5.2.1", extras = ["redis"], optional = true}
httpx = {version = "<0.29.0,>=0.18.2", optional = true}
ipython = {version = "<10.0.0,>=7.29.0", optional = true}
jmespath = {version = "<2.0.0,>=0.10", optional = true}
pottery = {version = "<4.0.0,>=3.0.0", optional = true}
psycopg2 = {version = "<3.0.0,>=2.9.2", optional = true}
aiodns = {version = "<5.0.0,>=3.0.0", optional = true}
pydantic = "<3.0.0,>=2.0.3"
aiosqlite = {version = "<0.23,>=0.17", optional = true}
pyxdg = "<0.29,>=0.27"
typing-extensions = "<5.0.0,>=4.6.1"
greenlet = {version = "<4.0.0,>=2.0.0", optional = true, allow-prereleases = true}

[tool.poetry.group.dev.dependencies]
Jinja2 = "<4.0.0,>=3.0.3"
ansible = [
    { version = "<7.0.0,>=5.2.0", python = "~3.8" },
    { version = "<9.0.0,>=7.0.0", python = "~3.9" },
    { version = "<11.0.0,>=9.0.0", python = "~3.10" },
    { version = "<12.0.0,>=11.0.0", python = ">=3.11,<4" },
]
ansible-core = [
    { version = "<2.13,>=2.12.1", python="~3.8" },
    { version = "<2.16,>=2.14", python="~3.9" },
    { version = "<2.18,>=2.16", python="~3.10" },
    { version = "<3.0,>=2.18", python=">=3.11,<4" },
]
ansible-runner = [
    { version = "<2.4,>=2.1.1", python = "~3.8", optional = true },
    { version = "<3.0,>=2.4", python = ">=3.9,<4", optional = true },
]
httpx = "<0.29.0,>=0.18.2"
jmespath = "<2.0.0,>=0.10"
poetry = [
    { version = "<2.0.0,>=1.2.0", python = "~3.8" },
    { version = "<3.0.0,>=1.2.0", python = ">=3.9,<4" },
]
pottery = "<4.0.0,>=3.0.0"
pytest = "<10.0.0,>=6.2.5"
pytest-asyncio = "<2.0.0,>=0.17"
pytest-cov = "<8.0.0,>=3.0.0"
tox = "<5.0.0,>=3.24.4"
psycopg = "<4.0.0,>=3.0.16"
pytest-postgresql = "<10.1.0,>=4.1.1"
ruff = "<0.18.0,>=0.7.3"
toml = "<0.11.0,>=0.10.2"

[tool.poetry.extras]
# the `serve` command
app = [
    "SQLAlchemy", "alembic", "bcrypt", "fastapi", "uvicorn",
    "aiodns", "ansible-runner", "Jinja2", "jmespath", "pottery", "celery",
]
# the `admin ...` commands
admin = ["SQLAlchemy", "bcrypt", "fastapi"]
# the `setup-db` and `migration` commands
database = ["SQLAlchemy", "alembic", "bcrypt"]
# the `dev-shell` command
dev-shell = ["ipython", "SQLAlchemy", "alembic", "bcrypt"]
# the `serve` and `dev-shell` commands, if you use SQLite
sqlite = ["aiosqlite"]
# the `serve`, `worker` and `dev-shell` commands, if you use PostgreSQL
postgresql = ["psycopg2", "asyncpg"]
# the `worker` command
tasks = ["aiodns", "ansible-runner", "Jinja2", "jmespath", "pottery", "celery"]
# the `serve-legacy` command
legacy = ["httpx", "Jinja2"]
# the `client ...` commands
client = ["httpx"]

[tool.poetry.scripts]
duffy = "duffy.cli:cli"

[tool.pytest.ini_options]
addopts = "--cov-config .coveragerc --cov=duffy --cov-report term --cov-report xml --cov-report html"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_format = "%(levelname)s: %(asctime)s %(short_request_id_optional)s(%(filename)s:%(lineno)s %(message)s)"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
allowed-confusables = ["’"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
